name: belgium_plate
description: "Belgium's licence plates for the plate_core library — nine designs (private, dealer, trailer, temporary, vintage, diplomatic, royal, military, motorcycle) in red, green, white-on-red and black themes, with Latin alphabets and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
